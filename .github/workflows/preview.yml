name: Preview

# Deploys each same-repo PR to a Netlify draft URL (https://pr-<n>--<site>.netlify.app) and
# comments the link, so the PR's code can be tried before merge. Reuses the repo secrets that
# deploy.yml needs: NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID. A draft deploy never touches production.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

# A newer push to the same PR replaces a preview that is still building.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # PR code builds with the Netlify token here, so only branches of this repo get a preview.
    # A fork's PR has no secrets anyway; this keeps that explicit and the job quiet.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (tag in the comment) so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Values reach the script through env, never interpolated into it. --alias gives the stable
      # per-PR URL; the URL is read back from the CLI output by its known prefix.
      - name: Deploy the preview and comment the link
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID are not set, so there is no preview."
            exit 0
          fi

          npx --yes netlify-cli@27.14.2 deploy --build --alias "pr-${PR}" 2>&1 | tee deploy.log
          url=$(grep -Eo "https://pr-${PR}--[A-Za-z0-9.-]+\.netlify\.app" deploy.log | tail -n1)
          if [ -z "$url" ]; then
            echo "::error::Deployed, but no pr-${PR}-- URL was found in the CLI output."
            exit 1
          fi

          marker='<!-- codemap-preview -->'
          body="$marker
          **Preview** of ${SHA:0:7}: ${url}/?gh=${REPO}&pr=${PR}
          Draft deploy from this branch's code; the link opens this PR's map in it."
          existing=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${marker}\")) | .id" | head -n1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${existing}" -f body="$body" >/dev/null
          else
            gh api "repos/${REPO}/issues/${PR}/comments" -f body="$body" >/dev/null
          fi
