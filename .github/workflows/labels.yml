name: Labels

# The feedback link and issue form apply these labels, and GitHub ignores labels that do not exist.
on:
  push:
    branches: [main]
    paths: [.github/workflows/labels.yml]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create feedback --repo "$GITHUB_REPOSITORY" --color 1d76db --description "User feedback" --force
          gh label create from-app --repo "$GITHUB_REPOSITORY" --color 5319e7 --description "Filed from the in-app feedback button" --force
